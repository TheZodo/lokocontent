# Railway config for @lokocontent/api (monorepo).
# The API depends on @lokocontent/db, so the build must run from the repo root.
#
# In Railway dashboard for the API service:
# - Set "Root Directory" to empty (use repository root). Do not set it to apps/api.
# - Optionally set variable: RAILWAY_DOCKERFILE_PATH=apps/api/Dockerfile
#   (This file sets builder and dockerfilePath below so the variable may be redundant.)

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "node dist/main.js"
